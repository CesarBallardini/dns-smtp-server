---
# Start a stopped DNS + SMTP VM. Idempotent: no-op if already RUNNING.
#
#     make vm-start

- name: Start the DNS + SMTP Oracle Cloud VM
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Find instances in the compartment
      oracle.oci.oci_compute_instance_facts:
        compartment_id: "{{ oci_compartment_id }}"
      register: all_instances

    - name: Filter instances by env tag
      ansible.builtin.set_fact:
        dnssmtp_instances: >-
          {{ all_instances.instances
             | rejectattr('lifecycle_state', 'in', ['TERMINATED', 'TERMINATING'])
             | selectattr('freeform_tags.dnssmtp', 'defined')
             | selectattr('freeform_tags.dnssmtp', 'eq', dnssmtp_env_tag)
             | list }}

    - name: Fail if no instance is found
      ansible.builtin.fail:
        msg: |
          No live instance found with freeform_tag dnssmtp={{ dnssmtp_env_tag }}
          in compartment {{ oci_compartment_id }}. Run `make vm-create` first.
      when: dnssmtp_instances | length == 0

    # START is only valid from STOPPED; guarding on it skips RUNNING
    # instances and avoids erroring on transient STOPPING / STARTING.
    - name: Start each stopped instance
      oracle.oci.oci_compute_instance_actions:
        instance_id: "{{ item.id }}"
        action: "start"
        wait: true
      loop: "{{ dnssmtp_instances }}"
      loop_control:
        label: "{{ item.display_name }} ({{ item.lifecycle_state }})"
      when: item.lifecycle_state == "STOPPED"

    - name: Show resulting state
      ansible.builtin.debug:
        msg: "{{ item.display_name }}: was {{ item.lifecycle_state }} -> now RUNNING"
      loop: "{{ dnssmtp_instances }}"
      loop_control:
        label: "{{ item.display_name }}"
