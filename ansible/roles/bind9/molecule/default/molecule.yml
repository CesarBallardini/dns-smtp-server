---
# Per-role test for bind9. Docker driver against a systemd-ready Ubuntu 24.04
# image (the host docker.sock is mounted into the controller container).
#
#   make test-role ROLE=bind9
#   (inside `make shell`: cd ansible/roles/bind9 && molecule test)

driver:
  name: docker

platforms:
  - name: bind9-test
    image: geerlingguy/docker-ubuntu2404-ansible
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  config_options:
    defaults:
      stdout_callback: default
      callback_result_format: yaml

verifier:
  name: ansible
