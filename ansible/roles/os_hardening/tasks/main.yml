---
# OS hardening for the DNS + SMTP VM (adapted from bluedoter's os_hardening):
# - non-root operator user with sudo + the original SSH key
# - lock down sshd (no password, no root login)
# - chrony, fail2ban (sshd + postfix jails), unattended-upgrades
# - open the service ports in OCI's default iptables ruleset, live and persisted
# - swapfile

- name: Apt update + safe upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

# iptables-persistent is preseeded so its install never prompts. No ufw: OCI
# images already manage the host firewall through iptables-persistent, and a
# second layer on top only adds places for a port to be silently closed.
- name: Preseed iptables-persistent (no auto-save prompts during apt)
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "iptables-persistent/autosave_v{{ item }}"
    value: "false"
    vtype: boolean
  loop: ["4", "6"]

- name: Install hardening + utility packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - chrony
      - curl
      - dnsutils
      - fail2ban
      - iptables
      - iptables-persistent
      - python3-systemd
      - sudo
      - unattended-upgrades
    state: present

# ----------------------------------------------------------------- ops user
- name: Create the operator user
  ansible.builtin.user:
    name: "{{ os_hardening_ops_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    state: present

- name: Allow ops user passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ os_hardening_ops_user }}-nopasswd"
    content: "{{ os_hardening_ops_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

- name: Check which cloud-init user homes exist (ubuntu / opc / debian)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /home/ubuntu/.ssh/authorized_keys
    - /home/opc/.ssh/authorized_keys
    - /home/debian/.ssh/authorized_keys
  register: os_hardening_cloud_init_keys

- name: Read the cloud-init user's authorized_keys
  ansible.builtin.slurp:
    src: "{{ (os_hardening_cloud_init_keys.results | selectattr('stat.exists') | first).item }}"
  register: os_hardening_cloud_init_keys_content
  when: os_hardening_cloud_init_keys.results | selectattr('stat.exists') | list | length > 0

- name: Authorize ops user with the cloud-init SSH key
  ansible.posix.authorized_key:
    user: "{{ os_hardening_ops_user }}"
    state: present
    key: "{{ os_hardening_cloud_init_keys_content.content | b64decode | trim }}"
  when: os_hardening_cloud_init_keys_content is not skipped

# Silences "remote_tmp did not exist" warnings for later become_user: ops.
- name: Pre-create Ansible remote_tmp for the ops user
  ansible.builtin.file:
    path: "/home/{{ os_hardening_ops_user }}/.ansible/tmp"
    state: directory
    owner: "{{ os_hardening_ops_user }}"
    group: "{{ os_hardening_ops_user }}"
    mode: "0700"

# ------------------------------------------------------------------- sshd
- name: Lock down sshd configuration
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      # Managed by Ansible (os_hardening)
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Reload sshd

# ------------------------------------------------------------- firewall
# OCI's Ubuntu images end the INPUT chain with
#   -A INPUT -j REJECT --reject-with icmp-host-prohibited
# An ACCEPT appended after it is dead code, so each rule is inserted at the
# REJECT rule's current position (read live, not hard-coded).
- name: Find the REJECT rule position in the INPUT chain
  ansible.builtin.shell:
    cmd: set -o pipefail && iptables -L INPUT --line-numbers -n | awk '$2 == "REJECT" { print $1; exit }'
    executable: /bin/bash
  register: os_hardening_reject_rule
  changed_when: false

- name: Allow the service ports (live ruleset)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.proto }}"
    destination_port: "{{ item.port | string }}"
    ctstate: NEW
    jump: ACCEPT
    action: "{{ 'insert' if os_hardening_reject_rule.stdout else 'append' }}"
    rule_num: "{{ os_hardening_reject_rule.stdout if os_hardening_reject_rule.stdout else omit }}"
    comment: "dnssmtp-{{ item.port }}-{{ item.proto }}"
  loop: "{{ os_hardening_public_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"

# Persist by editing the saved ruleset rather than `netfilter-persistent
# save`, which would also snapshot fail2ban's dynamic f2b-* chains.
- name: Check for a persisted IPv4 ruleset
  ansible.builtin.stat:
    path: "{{ os_hardening_rules_v4_path }}"
  register: os_hardening_rules_v4

- name: Persist the service port rules before the REJECT rule
  ansible.builtin.lineinfile:
    path: "{{ os_hardening_rules_v4_path }}"
    line: >-
      -A INPUT -p {{ item.proto }} -m conntrack --ctstate NEW -m {{ item.proto }}
      --dport {{ item.port }} -m comment --comment "dnssmtp-{{ item.port }}-{{ item.proto }}" -j ACCEPT
    insertbefore: '^-A INPUT -j REJECT'
    state: present
  loop: "{{ os_hardening_public_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"
  when: os_hardening_rules_v4.stat.exists

# ----------------------------------------------------- fail2ban + services
- name: Configure fail2ban jails
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Enable + start hardening services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - chrony
    - fail2ban

- name: Configure unattended-upgrades to auto-apply security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

# ----------------------------------------------------------------- swapfile
- name: Configure a swapfile
  when: os_hardening_swap_enabled | bool
  block:
    - name: Check whether the swapfile already exists
      ansible.builtin.stat:
        path: "{{ os_hardening_swapfile_path }}"
      register: os_hardening_swapfile

    - name: Allocate the swapfile
      ansible.builtin.command:
        cmd: "fallocate -l {{ os_hardening_swap_size }} {{ os_hardening_swapfile_path }}"
        creates: "{{ os_hardening_swapfile_path }}"

    - name: Secure the swapfile (0600 root)
      ansible.builtin.file:
        path: "{{ os_hardening_swapfile_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Format the swap area
      ansible.builtin.command:
        cmd: "mkswap {{ os_hardening_swapfile_path }}"
      when: not os_hardening_swapfile.stat.exists
      changed_when: true

    - name: Persist the swapfile in /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "{{ os_hardening_swapfile_path }} none swap sw 0 0"
        regexp: "^{{ os_hardening_swapfile_path | regex_escape }}\\s"
        state: present

    - name: Check active swap areas
      ansible.builtin.command:
        cmd: swapon --show=NAME --noheadings
      register: os_hardening_swap_active
      changed_when: false

    - name: Enable the swapfile now
      ansible.builtin.command:
        cmd: "swapon {{ os_hardening_swapfile_path }}"
      when: os_hardening_swapfile_path not in os_hardening_swap_active.stdout_lines
      changed_when: true
