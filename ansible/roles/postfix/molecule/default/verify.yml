---
- name: Verify -- postfix accepts, forwards, authenticates, and signs correctly
  hosts: all
  gather_facts: true
  tasks:
    - name: Install goss
      ansible.builtin.include_tasks: ../../../../tasks/install-goss.yml

    - name: Copy the SMTP behaviour checks
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/tests/smtp_checks.py"
        dest: /tmp/smtp_checks.py
        mode: "0755"

    - name: Validate with goss
      ansible.builtin.include_tasks: ../../../../tasks/run-goss.yml
      vars:
        goss_spec: "{{ playbook_dir }}/tests/postfix.goss.yaml"
