---
# Install the pinned, sha256-verified goss binary on the target host.
# Included by the role molecule verify.yml files and playbooks/verify.yml. Same
# asset + checksums as ansible/Dockerfile; bump both together.

- name: Map the host architecture to the goss asset
  ansible.builtin.set_fact:
    goss_asset: "{{ goss_assets[ansible_facts['architecture']] }}"
  vars:
    goss_assets:
      x86_64: { arch: amd64, sha256: "87dd36cfa1b8b50554e6e2ca29168272e26755b19ba5438341f7c66b36decc19" }
      aarch64: { arch: arm64, sha256: "14fd24ac08236559f4809e6a627792d1b947ed98654bba1662ef1d6122d77e18" }

- name: Install goss
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/goss-org/goss/releases/download/v0.4.9/goss-linux-{{ goss_asset.arch }}"
    dest: /usr/local/bin/goss
    checksum: "sha256:{{ goss_asset.sha256 }}"
    mode: "0755"
